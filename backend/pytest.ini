[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
env =
    ENVIRONMENT=test
    DATABASE_URL=postgresql://zenglow:zenglow_dev@localhost:5432/zenglow_test
    DATABASE_TEST_URL=postgresql://zenglow:zenglow_dev@localhost:5432/zenglow_test
    REDIS_URL=redis://localhost:6379/15
    CELERY_BROKER_URL=redis://localhost:6379/14
    CELERY_RESULT_BACKEND=redis://localhost:6379/13
    JWT_SECRET_KEY=test-jwt-secret-key-for-testing-only
    SECRET_KEY=test-secret-key
    PAYMENT_PROVIDER=mock
    EMAIL_PROVIDER=console
    SMS_PROVIDER=console
    STORAGE_PROVIDER=local
