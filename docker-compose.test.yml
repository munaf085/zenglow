version: "3.9"

# Lightweight compose for running tests in CI
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenglow_test
      POSTGRES_USER: zenglow
      POSTGRES_PASSWORD: zenglow_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenglow -d zenglow_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
