name: Deploy — Production Build

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "8.15.4"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/zenglow

jobs:
  # ── Build & Push Production Images ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: infrastructure/docker/Dockerfile.backend
          - service: celery
            dockerfile: infrastructure/docker/Dockerfile.celery
          - service: customer-web
            dockerfile: infrastructure/docker/Dockerfile.customer-web
          - service: business-web
            dockerfile: infrastructure/docker/Dockerfile.business-web
          - service: admin-web
            dockerfile: infrastructure/docker/Dockerfile.admin-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to On-Prem ─────────────────────────────────────────────────────
  # Deployment is via SSH + docker compose pull && docker compose up -d
  # Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY in repository secrets.
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && secrets.DEPLOY_HOST != ''
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/zenglow
            echo "Pulling latest images..."
            docker compose pull
            echo "Running migrations..."
            docker compose run --rm backend alembic upgrade head
            echo "Starting services..."
            docker compose up -d --remove-orphans
            echo "Deployment complete."
            docker compose ps

      - name: Notify on success
        if: success()
        run: echo "Deployment to production succeeded for ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment FAILED for ${{ github.sha }}"

